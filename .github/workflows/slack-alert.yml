name: Slack Alert

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  slack_notification:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Assign issue if requested
      - name: Assign, Label, and Deep Clean
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            let issueBody = context.payload.issue.body || "";
            const issueNumber = context.payload.issue.number;

            // 1. Handle Assignment (Case Insensitive)
            if (issueBody.toLowerCase().includes("assign_self: yes")) {
              const username = context.payload.issue.user.login;
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [username],
              });
            }

            // 2. Handle Labeling (Handles empty labels too)
            const labelLine = issueBody.split('\n').find(l => l.trim().toLowerCase().startsWith('label:'));
            if (labelLine) {
              const labelName = labelLine.split(':')[1].trim();
              if (labelName && labelName.toLowerCase() !== "select an option") {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [labelName],
                });
              }
            }

            // 3. 🧹 THE DEEP CLEAN
            // This regex finds the lines starting with 'assign_self' or 'label' (any case) 
            // and removes them entirely, including the empty space they leave behind.
            const cleanedBody = issueBody
              .replace(/assign_self:\s*.*/gi, "")
              .replace(/label:\s*.*/gi, "")
              .trim();

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: cleanedBody,
            });
            
      # Step 2: Send Slack notification
      # Step 2: Prepare formatted payload safely
      - name: Prepare Slack Payload
        id: prepare-slack-payload
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = context.payload.issue.title;
            const author = context.payload.issue.user.login;
            const issueUrl = context.payload.issue.html_url;

            const payload = {
              text: `🚀 New KB Idea: ${issueTitle}`,
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: `💡 *New KB submitted!*\n\n*Title:* ${issueTitle}\n*Author:* \`${author}\`\n*Link:* ${issueUrl}`
                  }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "👤 View & Assign" },
                      url: issueUrl
                    },
                    {
                      type: "button",
                      text: { type: "plain_text", text: "Close Issue" },
                      url: `${issueUrl}#issue-comment-box`
                    }
                  ]
                }
              ]
            };

            core.setOutput('payload', JSON.stringify(payload));

      # Step 3: Send Slack notification
      - name: Send Slack Message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'pdegave-july-channel'
          payload: ${{ steps.prepare-slack-payload.outputs.payload }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
