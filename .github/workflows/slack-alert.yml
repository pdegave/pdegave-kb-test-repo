name: Slack Alert

on:
  issues:
    types: [opened]

jobs:
  slack_notification:
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue if requested
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;

            console.log("Issue Body:", issueBody);

            if (issueBody && issueBody.includes("assign_self: Yes")) {
              const username = context.payload.issue.user.login;

              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                assignees: [username],
              });

              console.log(`Assigned issue to ${username}`);
            } else {
              console.log("No assignment needed");
            }

      - name: Send Slack Message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'pdegave-kb-test-channel'
          payload: |
            {
              "text": "🚀 New KB Idea: ${{ github.event.issue.title }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "💡 *New KB idea submitted!*\n\n*Title:* ${{ github.event.issue.title }}\n*Author:* `${{ github.event.issue.user.login }}`\n🔗 *Link:* ${{ github.event.issue.html_url }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "👤 View & Assign" },
                      "url": "${{ github.event.issue.html_url }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "✅ Close Issue" },
                      "style": "danger",
                      "url": "${{ github.event.issue.html_url }}#issue-comment-box"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
