name: Slack Alert
on:
  issues:
    types: [opened]

jobs:
  slack_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          # This payload is structured to FORCE Slack to use Blocks
          payload: |
            {
              "text": "New KB Idea: ${{ github.event.issue.title }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "💡 *New KB idea submitted!*\n\n*Title:* ${{ github.event.issue.title }}\n*Author:* `${{ github.event.issue.user.login }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "👤 Assign Me",
                        "emoji": true
                      },
                      "value": "assign_issue",
                      "url": "${{ github.event.issue.html_url }}/assignees"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "✅ Close Issue",
                        "emoji": true
                      },
                      "style": "danger",
                      "value": "close_issue",
                      "url": "${{ github.event.issue.html_url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
