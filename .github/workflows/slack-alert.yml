name: Slack Alert

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  slack_notification:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Assign issue if requested
      - name: Assign and Label issue if requested
        uses: actions/github-script@v7
        with:
          script: |
            let issueBody = context.payload.issue.body || "";
            const bodyLower = issueBody.toLowerCase();
            const issueNumber = context.payload.issue.number;

            // 1. Handle Assignment
            if (bodyLower.includes("assign_self: yes")) {
              const username = context.payload.issue.user.login;
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees: [username],
              });
              console.log(`Assigned to ${username}`);
            }

            // 2. Handle Labeling
            // This looks for "Label: name-of-label" in the text
            const labelMatch = issueBody.match(/Label:\s*(.+)/i);
            if (labelMatch && labelMatch[1]) {
              const labelName = labelMatch[1].trim();
              if (labelName.toLowerCase() !== "select an option") {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [labelName],
                });
                console.log(`Added label: ${labelName}`);
              }
            }

            // 3. 🧹 CLEANUP: Remove both hidden tags from the body
            const cleanedBody = issueBody
              .split("\n")
              .filter(line => 
                !line.toLowerCase().includes("assign_self:") && 
                !line.toLowerCase().includes("label:")
              )
              .join("\n")
              .trim();

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: cleanedBody,
            });
            
      # Step 2: Send Slack notification
      - name: Send Slack Message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'pdegave-kb-test-channel'
          payload: |
            {
              "text": "🚀 New KB Idea: ${{ github.event.issue.title }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "💡 *New KB submitted!*\n\n*Title:* ${{ github.event.issue.title }}\n*Author:* `${{ github.event.issue.user.login }}`\n*Link:* ${{ github.event.issue.html_url }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "👤 View & Assign" },
                      "url": "${{ github.event.issue.html_url }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Close Issue" },
                      "url": "${{ github.event.issue.html_url }}#issue-comment-box"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
