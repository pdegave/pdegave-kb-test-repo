name: Slack Alert
on:
  issues:
    types: [opened]

jobs:
  slack_notification:
    runs-on: ubuntu-latest
    steps:
      # Logic: If the Slack form said "Yes", assign the issue to you
      - name: Auto-assign if requested
        if: contains(github.event.issue.body, 'Assign-Me: Yes')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['pdegave']
            })

      # Send the PagerDuty-style alert
      - name: Send Slack Message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'team-ecmsupport-kb-alert' 
          payload: |
            {
              "text": "🚀 New KB Idea: ${{ github.event.issue.title }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "💡 *New KB idea submitted!*\n\n*Title:* ${{ github.event.issue.title }}\n*Author:* `${{ github.event.issue.user.login }}`"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "👤 View & Assign" },
                      "url": "${{ github.event.issue.html_url }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "✅ Close Issue" },
                      "style": "danger",
                      "url": "${{ github.event.issue.html_url }}#issue-comment-box"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
