name: Slack Alert

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  slack_notification:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Assign issue if requested
      - name: Assign issue if requested
        uses: actions/github-script@v7
        with:
          script: |
            let issueBody = context.payload.issue.body || "";

            console.log("Original Issue Body:", issueBody);

            const bodyLower = issueBody.toLowerCase();

            // Check if assignment is needed
            if (bodyLower.includes("assign_self: yes")) {
              const username = context.payload.issue.user.login;

              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                assignees: [username],
              });

              console.log(`Assigned issue to ${username}`);
            }

            // 🧹 CLEANUP: remove assign_self line from body
            const cleanedBody = issueBody
              .split("\n")
              .filter(line => !line.toLowerCase().includes("assign_self:"))
              .join("\n")
              .trim();

            // Update issue body without assign_self
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: cleanedBody,
            });

            console.log("Cleaned up issue body");

      # Step 2: Send Slack notification
      - name: Send Slack Message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'pdegave-kb-test-channel'
          payload: |
            {
              "text": "🚀 New KB Idea: ${{ github.event.issue.title }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "💡 *New KB submitted!*\n\n*Title:* ${{ github.event.issue.title }}\n*Author:* `${{ github.event.issue.user.login }}`\n*Link:* ${{ github.event.issue.html_url }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "👤 View & Assign" },
                      "url": "${{ github.event.issue.html_url }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Close Issue" },
                      "url": "${{ github.event.issue.html_url }}#issue-comment-box"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
